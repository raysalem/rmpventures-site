<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMP Ventures Brand</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="brand/rmp-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#1d2129;--line:#2c313b;--fg:#e6e8ee;--mute:#9aa3b4;--blue:#6aa3ff}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ec;--fg:#1d2433;--mute:#5f6879;--blue:#1d5fd1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:48px 20px}
.label{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{font-size:34px;margin:.2em 0 .6em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.art{background:#fff;border-radius:10px;padding:18px;display:grid;place-items:center;min-height:240px}
.art img{max-width:100%;max-height:260px;height:auto}
.card h2{font-size:17px;margin:14px 0 4px}
.card p{margin:0;color:var(--mute);font-size:14px}
a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="label">rmp ventures / brand assets</div>
  <h1>Logos for future use</h1>
  <div class="grid">
    <div class="card"><div class="art"><img src="brand/rmp-seal.png" alt="RMP Ventures seal" width="1000" height="1000"></div><h2>Seal</h2><p>Round emblem. Letterhead, documents, stamps. <a href="brand/rmp-seal.png" download>PNG</a> · <a href="brand/rmp-seal.svg" download>SVG</a></p></div>
    <div class="card"><div class="art"><img src="brand/rmp-lockup.png" alt="RMP Ventures logo" width="1500" height="520"></div><h2>Lockup</h2><p>Icon plus name. Email signature, cards, signs. <a href="brand/rmp-lockup.png" download>PNG</a> · <a href="brand/rmp-lockup.svg" download>SVG</a></p></div>
    <div class="card"><div class="art"><img src="brand/rmp-icon.png" alt="RMP Ventures icon" width="460" height="620"></div><h2>Icon</h2><p>Lion on the rock. Favicon, avatar, small spaces. <a href="brand/rmp-icon.png" download>PNG</a> · <a href="brand/rmp-icon.svg" download>SVG</a></p></div>
  </div>
  <p style="margin-top:28px"><a href="./">← Back to rmpventures.com</a></p>
</div>
</body>
</html>
